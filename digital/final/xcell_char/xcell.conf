#------------------------------------------------------------------------
#
#  Configuration file for cell characterization - sky130A core devices
#
#------------------------------------------------------------------------
begin xcell

#
# the spice setup file for the process - see stdspice.spi in this directory.
# corner must match a corner defined in your sky130 .lib include (e.g.
# TT/SS/FF from the sky130 SPICE model deck).
#
string tech_setup "stdspice.spi"
string corner "TT"

# supply - sky130A core logic nominal Vdd is 1.8V (not the 1.0V default
# in the xcell example, which was for a different process)
real Vdd 1.8

# temp (K) - 298K = 25C
real T   298

# process
real P_value 1.0

# kohms
real R_value 300

# units
begin units
    real current_conv 1e-6
    real power_conv 1e-6
    real resis_conv 1e3
    real time_conv 1e-12
    real cap_conv 1e-15
end

# slew thresholds 20% to 80%
begin waveform
    # rising
    real rise_low  20
    real rise_high 80

    # falling
    real fall_high 80
    real fall_low  20
end

# maximum transition time for a signal change (in "time" units, ps)
real default_max_transition_time 1000

#
# Measurement window period (in ps)
#
real period 25000

#
# within a measurement window, each signal change is separated by this
# amount of time (in ps). Period must be at least 4 times this amount.
#
real short_window 4000

# leakage averaging window (ps); period must be > 4x this
real leak_window 4000

#
# Input capacitance estimation - RC delay to estimate C
#
real cap_measure 0.1

# table points for delay and power (ps / fF) - starting point, adjust to
# taste once you have real numbers back
real_table input_trans  6.6 13.2 26.4 51.8 97.8 181.0 325.7
real_table load         0.1 0.5 1 2 4 10 20 30 50 100

# for hspice
#string spice_binary "hspice"

# for Xyce
string spice_binary "Xyce"

# 0 = raw, 1 = .tr0
int spice_output_fmt 0

end
